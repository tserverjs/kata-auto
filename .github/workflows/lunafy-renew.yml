name: 🖥️ Lunafy Turnstile 自动续期（CloakBrowser）

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # 避免 3.13+ 的 sync API 兼容问题

      - name: 📦 安装系统依赖（xvfb + Chromium 运行库）
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 \
            libgbm1 libasound2t64 libpango-1.0-0 libcairo2 libatspi2.0-0

      - name: 📦 安装 Python 依赖 + 预下载 CloakBrowser 二进制
        run: |
          pip install cloakbrowser requests
          python -m cloakbrowser install
          python -m playwright install ffmpeg

      - name: 🌐 启动 GOST 代理隧道
        env:
          GOST_PROXY: ${{ secrets.GOST_PROXY }}
        run: |
          if [ -z "${GOST_PROXY}" ]; then
            echo "❌ 未配置 GOST_PROXY"
            exit 1
          fi
          GOST_VERSION=$(curl -s https://api.github.com/repos/go-gost/gost/releases/latest | grep '"tag_name"' | cut -d'"' -f4 | tr -d 'v')
          echo "📦 GOST 版本: $GOST_VERSION"
          wget -q "https://github.com/go-gost/gost/releases/download/v${GOST_VERSION}/gost_${GOST_VERSION}_linux_amd64.tar.gz"
          tar -xzf gost_${GOST_VERSION}_linux_amd64.tar.gz
          chmod +x ./gost
          nohup ./gost -L socks5://:40000 -F "${GOST_PROXY}" > gost.log 2>&1 &
          sleep 6
          EXIT_IP=$(curl -s --max-time 6 --proxy socks5://127.0.0.1:40000 https://api.ipify.org || true)
          if [ -z "${EXIT_IP}" ]; then
            echo "❌ 代理隧道连接失败"
            cat gost.log
            exit 1
          fi
          echo "✅ 代理就绪，出口 IP: ${EXIT_IP}"

      - name: 🔍 运行 Lunafy 监控续期脚本（xvfb + headed 模式）
        env:
          KATABUMP_USER: ${{ secrets.KATABUMP_USER }}
          KATABUMP_PASS: ${{ secrets.KATABUMP_PASS }}
          WECHAT_WEBHOOK_KEY: ${{ secrets.WECHAT_WEBHOOK_KEY }}
          CLOAKBROWSER_LICENSE_KEY: ${{ secrets.CLOAKBROWSER_LICENSE_KEY }}  # 可选
          HEADLESS: "false"     # headed 模式 Turnstile 通过率最高，由 xvfb 提供虚拟显示
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" python renew-auto.py

      - name: 📷 上传调试截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lunafy-screenshots-${{ github.run_id }}
          path: "screenshots/*.png"
          retention-days: 5

      - name: 🎬 上传操作录屏
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lunafy-video-${{ github.run_id }}
          path: "videos/*.webm"
          retention-days: 7
